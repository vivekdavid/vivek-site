<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>John Paul II – Table of Contents</title>
  <style>
    :root {
      --bg: #ffffff;
      --card: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --accent: #7c3aed;          /* bright purple */
      --accent-soft: #f5f3ff;
      --border: #f0f0f5;
      --papal: #9f1239;          /* soft papal red for accents */
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      padding: 2.5rem 1.25rem;
    }

    .container {
      max-width: 680px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 2.75rem;
    }

    h1 {
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: -0.03em;
      color: var(--text);
      margin-bottom: 0.35rem;
    }

    .subtitle {
      color: var(--muted);
      font-size: 1.05rem;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 2rem 1.75rem;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.04);
    }

    /* Emoji ordered list */
    ol.emoji-list {
      list-style: none;
      counter-reset: emoji-counter;
      padding-left: 0;
    }

    ol.emoji-list > li {
      counter-increment: emoji-counter;
      position: relative;
      padding: 1rem 0 1rem 3.4rem;
      border-bottom: 1px solid var(--border);
    }

    ol.emoji-list > li:last-child {
      border-bottom: none;
      padding-bottom: 0.25rem;
    }

    ol.emoji-list > li:first-child {
      padding-top: 0.25rem;
    }

    ol.emoji-list > li::before {
      content: attr(data-emoji) " " counter(emoji-counter);
      position: absolute;
      left: 0;
      top: 1rem;
      font-size: 1.15rem;
      font-weight: 600;
      color: var(--accent);
      min-width: 2.8rem;
    }

    ol.emoji-list a {
      text-decoration: none;
      color: var(--text);
      font-size: 1.2rem;
      font-weight: 500;
      transition: color 0.15s ease;
      display: inline-block;
    }

    ol.emoji-list a:hover {
      color: var(--accent);
    }

    ol.emoji-list a::after {
      content: " →";
      opacity: 0;
      transition: opacity 0.15s ease;
      color: var(--accent);
    }

    ol.emoji-list a:hover::after {
      opacity: 1;
    }

    .note {
      margin-top: 1.75rem;
      padding: 1rem 1.2rem;
      background: var(--accent-soft);
      border-radius: 12px;
      font-size: 0.95rem;
      color: var(--muted);
      border-left: 4px solid var(--accent);
    }

    footer {
      text-align: center;
      margin-top: 2.5rem;
      font-size: 0.9rem;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Table of Contents</h1>
      <p class="subtitle">  Doctrine at a glance</p>
    </header>

    <div class="card">
      <ol class="emoji-list">
        <li data-emoji="&#x1FAA6;">
          <a href="all_souls">All Souls day</a>
        </li>
	</ol>
	<footer>
      In memory of St. John Paul II
    </footer>
  </div>
</body>
</html>
